baseURL: https://arcolaus.github.io
languageCode: zh-cn
title: Arcolaus' Blog
theme: PaperMod
pageinate: 7

minify:
  disableXML: false
  minifyOutput: false

outputs:
  home:
    - HTML
    - RSS
    - JSON
params:
  enableInlineShortcodes: true
  enableRobotsTXT: true
  buildDrafts: false
  buildFuture: false
  enableEmoji: true
  buildExpired: false
  pygmentsUseClasses: true
  author: Arcolaus
  DateFormat: January 2, 2006
  defaultTheme: auto
  description: ExampleSite description
  env: production
  keywords:
    - Blog
    - Arcolaus
    - 郑皓月
  math: true
  title: Arcolaus' Blog
  ShowCodeCopyButtons: true
  homeInfoParams:
    Title: Hi there 👋
    Content: >-
      Gatsby believed in the green light, the orgastic future that year by
      year recedes before us. It eluded us then, but that's no matter--tomorrow
      we will run faster, stretch out our arms farther....


      And one fine morning. So we beat on, boats against the current, borne back ceaselessly into the past.
  socialIcons:
    - name: github
      url: https://github.com/Arcolaus
  assets:
    disableHLJS: true
    favicon: assets/jupiter_favicon/jupiter_planet_icon_32.png
    favicon16x16: assets/jupiter_favicon/jupiter_planet_icon_32.png
    favicon32x32: assets/jupiter_favicon/jupiter_planet_icon_32.png
    apple_touch_icon: assets/jupiter_favicon/jupiter_planet_icon_128.png
    safari_pinned_tab: assets/jupiter_favicon/jupiter_planet_icon_256.png
  profileMode:
    enabled: false
    title: ExampleSite
    imageWidth: 120
    fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]

# taxonomies:
#   archive: "archives
#   category: "categories"
#   tag: "tags"

menu:
  main:
    - identifier: archive
      name: Archives
      url: /archives
      weight: 10
    - identifier: categories
      name: Categories
      url: categories
      weight: 20
    - identifier: tags
      name: Tags
      url: /tags
      weight: 30
    - identifier: search
      name: Search
      url: /search
      weight: 40

markup:
  highlight:
    noClasses: false
    style: monokai
    codeFences: true
    lineNos: true
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - \[
              - \]
            - - $$
              - $$
          inline:
            - - \(
              - \)
            - - $
              - $
