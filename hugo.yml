baseURL: https://haleuan.github.io/
locale: zh-cn
title: Haleuan's Blog
theme: PaperMod
paginate: 7

enableInlineShortcodes: true
enableRobotsTXT: true
enableEmoji: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: false
  minifyOutput: false

outputs:
  home:
    - HTML
    - RSS
    - JSON
params:
  author: Haleuan
  DateFormat: January 2, 2006
  defaultTheme: auto
  description: ExampleSite description
  env: production
  keywords:
    - Blog
    - Haleuan
  math: true
  title: Haleuan's Blog
  ShowCodeCopyButtons: true
  ShowTaxonomies: true
  ShowCategories: true
  homeInfoParams:
    Title: This a Haleuan's Neverland
    Content: >-
      Gatsby believed in the green light, the orgastic future that year by
      year recedes before us. It eluded us then, but that's no matter--tomorrow
      we will run faster, stretch out our arms farther....


      And one fine morning. So we beat on, boats against the current, borne back ceaselessly into the past.
  socialIcons:
    - name: github
      url: https://github.com/Haleuan
  assets:
    disableHLJS: true
    favicon: assets/jupiter_favicon/jupiter_planet_icon_32.png
    favicon16x16: assets/jupiter_favicon/jupiter_planet_icon_32.png
    favicon32x32: assets/jupiter_favicon/jupiter_planet_icon_32.png
    apple_touch_icon: assets/jupiter_favicon/jupiter_planet_icon_128.png
    safari_pinned_tab: assets/jupiter_favicon/jupiter_planet_icon_256.png
  profileMode:
    enabled: false
    title: ExampleSite
    imageWidth: 120
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]

taxonomies:
  category: "categories"
  tag: "tags"

menu:
  main:
    - identifier: archive
      name: Archives
      url: /archives
      weight: 10
    # 添加categories菜单项
    - identifier: categories
      name: Categories
      url: /categories
      weight: 20
    - identifier: tags
      name: Tags
      url: /tags
      weight: 30
    - identifier: search
      name: Search
      url: /search
      weight: 40

markup:
  highlight:
    noClasses: false
    style: monokai
    codeFences: true
    lineNos: true
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - \[
              - \]
            - - $$
              - $$
          inline:
            - - \(
              - \)
            - - $
              - $
